---

# 拷贝 kubectl 与 kustomize  二进制文件
- stat:
    path: /usr/bin/kubectl
  register: kubectl
- stat:
    path: /usr/bin/kustomize
  register: kustomize

- name: 拷贝 kubectl 二进制文件
  copy:
    src: "{{ '../../binary/files/kubernetes/' + k8s_version + '/' + server_arch + '/kubectl' if modern_profile | bool else '../../binary/files/kubernetes/server/bin/kubectl' }}"
    dest: /usr/bin/kubectl
    owner: root
    group: root
    mode: 0755
  when: kubectl.stat.exists == False

- name: 拷贝 kustomize 二进制文件
  copy:
    src: ../../binary/files/kustomize/kustomize
    dest: /usr/bin/kustomize
    owner: root
    group: root
    mode: 0755
  when: not modern_profile | bool and kustomize.stat.exists == False
