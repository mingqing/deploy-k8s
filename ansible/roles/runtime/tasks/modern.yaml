---
- name: Create runtime directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop: [/etc/containerd/certs.d, /usr/local/bin, /usr/local/sbin, /opt/cni/bin, /etc/cni/net.d]
- name: Install containerd archive for this node
  ansible.builtin.unarchive:
    src: "../../binary/files/containerd/{{ containerd_version }}/{{ server_arch }}/containerd.tar.gz"
    dest: /usr/local
    creates: /usr/local/bin/containerd
  notify: restart containerd
- name: Install runc for this node
  ansible.builtin.copy:
    src: "../../binary/files/runc/{{ runc_version }}/{{ server_arch }}/runc.{{ server_arch }}"
    dest: /usr/local/sbin/runc
    mode: '0755'
  notify: restart containerd
- name: Install CNI plugins
  ansible.builtin.unarchive:
    src: "../../binary/files/cni/{{ cni_plugins_version }}/{{ server_arch }}/cni.tgz"
    dest: /opt/cni/bin
    creates: /opt/cni/bin/loopback
- name: Install crictl
  ansible.builtin.unarchive:
    src: "../../binary/files/crictl/{{ crictl_version }}/{{ server_arch }}/crictl.tar.gz"
    dest: /usr/local/bin
    creates: /usr/local/bin/crictl
- ansible.builtin.import_tasks: cri.yaml
- name: Configure kernel modules at boot
  ansible.builtin.copy:
    dest: /etc/modules-load.d/containerd.conf
    content: "overlay\nbr_netfilter\n"
    mode: '0644'
- name: Load kernel modules
  ansible.builtin.command: "modprobe {{ item }}"
  loop: [overlay, br_netfilter]
  changed_when: false
- name: Enable IPv4 forwarding
  ansible.builtin.copy:
    dest: /etc/sysctl.d/99-kubernetes-cri.conf
    content: "net.ipv4.ip_forward=1\nnet.bridge.bridge-nf-call-iptables=1\nnet.bridge.bridge-nf-call-ip6tables=1\n"
    mode: '0644'
  register: runtime_sysctl
- name: Apply cluster sysctls
  ansible.builtin.command: sysctl -p /etc/sysctl.d/99-kubernetes-cri.conf
  changed_when: runtime_sysctl.changed
- name: Configure containerd v3
  ansible.builtin.template:
    src: containerd/config-v3.toml.j2
    dest: /etc/containerd/config.toml
    mode: '0644'
  notify: restart containerd
- name: Install containerd service
  ansible.builtin.template:
    src: containerd/containerd.service.j2
    dest: /etc/systemd/system/containerd.service
    mode: '0644'
  notify: restart containerd
- ansible.builtin.import_tasks: registry.yaml
- name: Start containerd
  ansible.builtin.systemd_service:
    name: containerd
    enabled: true
    state: started
    daemon_reload: true
